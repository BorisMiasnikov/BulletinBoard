{% extends 'flatpages/default.html' %}


{% block title %}
Доска объявлений
{% endblock title %}


{% block content %}
{% for bul in bulletins %}
<blockquote>
    <p>{{bul.title}}</p>
    <p>{{bul.text}}</p>
    <cite>{{bul.author}} - <span>{{bul.date_in|date:'d M Y H:i'}}</span></cite>
</blockquote>
{% endfor %}
{% endblock content %}
